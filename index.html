<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Leap - Gravity Cinematic</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020205;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 1280px;
      max-height: 720px;
      box-shadow: 0 0 80px rgba(0, 245, 212, 0.2);
      overflow: hidden;
      background: #000;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px;
      color: #fff;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-weight: bold;
    }
    .score-box {
      font-size: 3.5rem;
      color: #00f5d4;
      font-family: monospace;
      letter-spacing: 3px;
      text-shadow: 0 0 25px rgba(0, 245, 212, 0.6);
    }
    .coin-box {
      color: #ff007f;
      font-size: 2rem;
      display: flex;
      align-items: center;
      gap: 10px;
      text-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
    }
    .screen-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(15,15,30,0.9) 0%, rgba(2,2,5,0.95) 100%);
      backdrop-filter: blur(15px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
      transition: opacity 0.3s ease;
      z-index: 10;
    }
    .hidden {
      display: none !important;
    }
    h1 {
      font-size: 4rem;
      text-transform: uppercase;
      background: linear-gradient(45deg, #ff007f, #7928ca, #00f5d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 15px;
      text-shadow: 0 0 50px rgba(255, 0, 127, 0.4);
      text-align: center;
      letter-spacing: 3px;
    }
    p.subtitle {
      color: #a0a5c0;
      font-size: 1.3rem;
      margin-bottom: 40px;
      text-align: center;
      max-width: 600px;
      line-height: 1.6;
    }
    .btn {
      background: linear-gradient(135deg, #ff007f, #00f5d4);
      color: #000;
      border: none;
      padding: 20px 55px;
      font-size: 1.6rem;
      font-weight: 900;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 35px rgba(255, 0, 127, 0.5);
      transition: all 0.2s ease;
      margin: 10px;
      text-transform: uppercase;
    }
    .btn:hover {
      transform: translateY(-4px) scale(1.06);
      box-shadow: 0 15px 45px rgba(0, 245, 212, 0.7);
    }
    .btn:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="canvas"></canvas>

  <div class="ui-layer">
    <div class="hud">
      <div class="score-box" id="score">0</div>
      <div class="coin-box">
        💎 <span id="coins">0</span>
      </div>
    </div>
  </div>

  <!-- Start Screen -->
  <div id="start-screen" class="screen-overlay">
    <h1>NEON LEAP</h1>
    <p class="subtitle">An immersive cyber world with cinematic visuals. Use one-touch or Space key to flip gravity and set an addictive high score!</p>
    <button class="btn" onclick="startGame()">Start Challenge</button>
  </div>

  <!-- Game Over Screen -->
  <div id="gameover-screen" class="screen-overlay hidden">
    <h1 style="background: linear-gradient(45deg, #ff0055, #ffaa00); -webkit-background-clip: text;">Journey Over</h1>
    <p class="subtitle" id="final-score">Score: 0</p>
    <p class="subtitle" id="high-score" style="color: #00f5d4; margin-top:-25px;">High Score: 0</p>
    <div>
      <button class="btn" onclick="startGame()">Play Again 🔄</button>
    </div>
  </div>
</div>

<script>
// --- Web Audio Synthesizer Engine ---
class AudioEngine {
  constructor() { this.ctx = null; }
  init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
  playFlip() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(250, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(850, this.ctx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.12);
  }
  playCoin() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(1318.51, this.ctx.currentTime); // E6
    osc.frequency.setValueAtTime(1975.54, this.ctx.currentTime + 0.08); // B6
    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.25);
  }
  playCrash() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(140, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(20, this.ctx.currentTime + 0.45);
    gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.45);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.45);
  }
}
const audio = new AudioEngine();

// --- Game Engine Variables ---
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = canvas.clientWidth;
  H = canvas.height = canvas.clientHeight;
}
window.addEventListener('resize', resize);
resize();

let gameState = 'START';
let score = 0;
let coins = parseInt(localStorage.getItem('gc_coins') || '0');
let highScore = parseInt(localStorage.getItem('gc_highscore') || '0');
let speed = 9;
let gravity = 0.9;
let frameCount = 0;
let cameraShake = 0;

const player = {
  x: 200,
  y: 0,
  w: 36,
  h: 60,
  vy: 0,
  inverted: false,
  animFrame: 0,
  reset() {
    this.y = H - 160;
    this.vy = 0;
    this.inverted = false;
  }
};

let obstacles = [];
let gems = [];
let particles = [];
let backgroundBuildings = [];
let foregroundLights = [];

// توليد خلفية واقعية سينمائية متعددة الطبقات (Parallax Skyline)
for (let i = 0; i < 20; i++) {
  backgroundBuildings.push({
    x: i * 120,
    w: Math.random() * 70 + 60,
    h: Math.random() * 300 + 120,
    color: `hsl(${Math.random() * 60 + 200}, 60%, 12%)`
  });
}

for (let i = 0; i < 30; i++) {
  foregroundLights.push({
    x: Math.random() * W,
    y: Math.random() * H,
    size: Math.random() * 2 + 1,
    speed: Math.random() * 2 + 1
  });
}

// --- رسم شخصية كرتونية مذهلة بتفاصيل حية داخل عالم واقعي ---
function drawCharacter(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  if (p.inverted) ctx.scale(1, -1);

  p.animFrame += speed * 0.1;
  const legCycle = Math.sin(p.animFrame);

  // تأثير توهج سينمائي واقعي حول الشخصية
  ctx.shadowColor = '#00f5d4';
  ctx.shadowBlur = 25;

  // الرداء / الجاكيت الكرتوني الانسيابي
  ctx.fillStyle = '#ff007f';
  ctx.beginPath();
  ctx.roundRect(-16, -55, 32, 40, 10);
  ctx.fill();

  // تفاصيل البذلة والخطوط السيبرانية
  ctx.fillStyle = '#00f5d4';
  ctx.fillRect(-4, -50, 8, 30);

  // رأس الشخصية (بأسلوب كرتوني محبب وجذاب)
  ctx.fillStyle = '#ffccaa';
  ctx.beginPath();
  ctx.arc(0, -64, 12, 0, Math.PI * 2);
  ctx.fill();

  // الشعر / الخوذة الملونة
  ctx.fillStyle = '#7928ca';
  ctx.beginPath();
  ctx.arc(0, -68, 10, Math.PI, Math.PI * 2);
  ctx.fill();

  // الأرجل الكرتونية الديناميكية الحركية
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';

  // الرجل الخلفية
  ctx.beginPath();
  ctx.moveTo(0, -15);
  ctx.lineTo(legCycle * 25, 18);
  ctx.stroke();

  // الرجل الأمامية
  ctx.beginPath();
  ctx.moveTo(0, -15);
  ctx.lineTo(-legCycle * 25, 18);
  ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.restore();
}

// --- توليد حواجز سينمائية مذهلة ---
function spawnObstacle() {
  const isTop = Math.random() > 0.5;
  const height = Math.random() * 150 + 100;
  obstacles.push({
    x: W + 150,
    y: isTop ? 50 : H - 50 - height,
    w: 60,
    h: height,
    isTop: isTop
  });

  if (Math.random() > 0.35) {
    gems.push({
      x: W + 180,
      y: isTop ? 50 + height + 55 : H - 50 - height - 55,
      size: 15,
      collected: false
    });
  }
}

function addExplosion(x, y, color) {
  for (let i = 0; i < 30; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 18,
      vy: (Math.random() - 0.5) * 18,
      size: Math.random() * 6 + 2,
      color: color,
      life: 1
    });
  }
}

// --- معالجة منطق اللعبة ---
function update() {
  if (gameState !== 'PLAYING') return;

  frameCount++;
  score = Math.floor(frameCount / 4);
  document.getElementById('score').innerText = score;
  speed = 9.5 + Math.floor(score / 200) * 0.8;

  if (player.inverted) {
    player.vy -= gravity;
  } else {
    player.vy += gravity;
  }
  player.y += player.vy;

  const floorY = H - 50;
  const ceilingY = 50;

  if (player.y > floorY) {
    player.y = floorY;
    player.vy = 0;
  } else if (player.y < ceilingY + player.h) {
    player.y = ceilingY + player.h;
    player.vy = 0;
  }

  if (frameCount % Math.max(38, 80 - Math.floor(score / 70)) === 0) {
    spawnObstacle();
  }

  // اصطدام العوائق
  for (let i = obstacles.length - 1; i >= 0; i--) {
    let o = obstacles[i];
    o.x -= speed;

    const px = player.x - 18;
    const py = player.y - player.h;
    if (px < o.x + o.w && px + player.w > o.x &&
        py < o.y + o.h && py + player.h > o.y) {
      triggerGameOver();
    }
    if (o.x < -150) obstacles.splice(i, 1);
  }

  // تجميع الجواهر الكريستالية
  for (let i = gems.length - 1; i >= 0; i--) {
    let g = gems[i];
    g.x -= speed;
    const dx = player.x - g.x;
    const dy = (player.y - 30) - g.y;
    if (Math.sqrt(dx * dx + dy * dy) < 38 && !g.collected) {
      g.collected = true;
      coins += 5;
      document.getElementById('coins').innerText = coins;
      localStorage.setItem('gc_coins', coins);
      audio.playCoin();
      addExplosion(g.x, g.y, '#00f5d4');
      gems.splice(i, 1);
    } else if (g.x < -50) {
      gems.splice(i, 1);
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life -= 0.03;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (cameraShake > 0.5) cameraShake *= 0.85;
}

// --- الرسم السينمائي المذهل ---
function render() {
  ctx.save();
  if (cameraShake > 0.5) {
    ctx.translate((Math.random() - 0.5) * cameraShake, (Math.random() - 0.5) * cameraShake);
  }

  // خلفية واقعية عميقة مع تدرجات أرجوانية وزرقاء سينمائية
  let bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#020208');
  bgGrad.addColorStop(0.5, '#0b0b1a');
  bgGrad.addColorStop(1, '#020205');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // رسم المباني الخلفية بتأثير العمق (Parallax Skyline)
  backgroundBuildings.forEach(b => {
    b.x -= speed * 0.2;
    if (b.x + b.w < 0) b.x = W + Math.random() * 100;
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, H - b.h - 50, b.w, b.h);
    
    // نوافذ مضيئة واقعية على المباني
    ctx.fillStyle = 'rgba(0, 245, 212, 0.25)';
    for (let wy = H - b.h - 30; wy < H - 70; wy += 25) {
      ctx.fillRect(b.x + 10, wy, 8, 12);
      ctx.fillRect(b.x + b.w - 18, wy, 8, 12);
    }
  });

  // أضواء الغبار والنجوم المتحركة في المشهد
  ctx.fillStyle = '#00f5d4';
  foregroundLights.forEach(l => {
    l.x -= l.speed * (speed * 0.3);
    if (l.x < 0) l.x = W;
    ctx.globalAlpha = 0.6;
    ctx.fillRect(l.x, l.y, l.size, l.size);
  });
  ctx.globalAlpha = 1.0;

  // الأرضية والسقف السينمائي النيون (مصقولة بإضاءة مذهلة)
  let railTop = ctx.createLinearGradient(0, 0, 0, 50);
  railTop.addColorStop(0, '#ff007f');
  railTop.addColorStop(1, '#110022');
  ctx.fillStyle = railTop;
  ctx.fillRect(0, 0, W, 50);

  let railBottom = ctx.createLinearGradient(0, H - 50, 0, H);
  railBottom.addColorStop(0, '#110022');
  railBottom.addColorStop(1, '#00f5d4');
  ctx.fillStyle = railBottom;
  ctx.fillRect(0, H - 50, W, 50);

  // العوائق السينمائية الحادة المتوهجة
  obstacles.forEach(o => {
    let obsGrad = ctx.createLinearGradient(o.x, o.y, o.x + o.w, o.y + o.h);
    obsGrad.addColorStop(0, '#ff0055');
    obsGrad.addColorStop(1, '#550022');
    
    ctx.fillStyle = obsGrad;
    ctx.shadowColor = '#ff0055';
    ctx.shadowBlur = 20;
    ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.shadowBlur = 0;
  });

  // الجواهر الكريستالية المتلألئة
  gems.forEach(g => {
    ctx.fillStyle = '#00f5d4';
    ctx.shadowColor = '#00f5d4';
    ctx.shadowBlur = 25;
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  // الجسيمات المتطايرة
  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  });
  ctx.globalAlpha = 1.0;

  // الشخصية ذات الطابع الكرتوني الجذاب داخل المشهد الواقعي
  if (gameState === 'PLAYING') {
    drawCharacter(player);
  }

  ctx.restore();
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

// التحكم
function handleFlip() {
  if (gameState === 'PLAYING') {
    player.inverted = !player.inverted;
    audio.playFlip();
    addExplosion(player.x, player.y - 30, '#ff007f');
  }
}

window.addEventListener('keydown', (e) => { if (e.code === 'Space') handleFlip(); });
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleFlip(); });
canvas.addEventListener('mousedown', () => { handleFlip(); });

function startGame() {
  audio.init();
  gameState = 'PLAYING';
  frameCount = 0;
  score = 0;
  obstacles = [];
  gems = [];
  particles = [];
  player.reset();

  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('gameover-screen').classList.add('hidden');
  document.getElementById('coins').innerText = coins;
}

function triggerGameOver() {
  gameState = 'GAMEOVER';
  audio.playCrash();
  cameraShake = 35;
  addExplosion(player.x, player.y - 30, '#ff0055');

  if (score > highScore) {
    highScore = score;
    localStorage.setItem('gc_highscore', highScore);
  }

  document.getElementById('final-score').innerText = `Score: ${score}`;
  document.getElementById('high-score').innerText = `High Score: ${highScore}`;
  document.getElementById('gameover-screen').classList.remove('hidden');
}

gameLoop();
</script>
</body>
</html>
